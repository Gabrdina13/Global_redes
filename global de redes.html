<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen global</title>
    <style>

        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-sidebar: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #cbd5e1;

            --accent-dark-blue: #0f172a;
            --accent-blue: #2563eb;
            --accent-light-blue: #0284c7;
            --accent-hover: #1d4ed8;
            --accent-bg-light: #e0f2fe;
            --accent-success: #16a34a;

            --terminal-bg: #0f172a;
            --terminal-text: #38bdf8;
            --terminal-header: #1e293b;

            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

            --transition-speed: 0.3s;
        }

        body.dark-theme {
            --bg-primary: #0b1120;
            --bg-secondary: #1e293b;
            --bg-sidebar: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-color: #334155;

            --accent-dark-blue: #1e293b;
            --accent-blue: #3b82f6;
            --accent-light-blue: #38bdf8;
            --accent-hover: #60a5fa;
            --accent-bg-light: #1e3a5f;
            --accent-success: #22c55e;

            --terminal-bg: #030712;
            --terminal-text: #38bdf8;
            --terminal-header: #111827;

            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        .view-hidden {
            display: none !important;
        }

        .view-active {
            display: block;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-large {
            padding: 0.8rem 1.6rem;
            font-size: 1.05rem;
        }

        /* PORTADA */
        .hero-section {
            max-width: 1300px;
            margin: 0 auto;
            padding: 4rem 1.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
            align-items: center;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background-color: var(--accent-bg-light);
            color: var(--accent-light-blue);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .hero-title {
            font-size: 2.8rem;
            line-height: 1.2;
            margin-bottom: 1.2rem;
            color: var(--text-primary);
        }

        .hero-description {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .units-section {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-header h2 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }

        .unit-card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .unit-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent-blue);
        }

        .unit-card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .unit-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-light-blue);
            text-transform: uppercase;
        }

        .unit-card-title {
            font-size: 1.3rem;
            color: var(--text-primary);
        }

        .unit-card-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .unit-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .unit-topics-count {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .course-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--accent-light-blue);
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            padding: 0;
            text-align: left;
        }

        .btn-back:hover {
            text-decoration: underline;
        }

        .unit-group {
            margin-bottom: 1rem;
        }

        .unit-group-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            padding-bottom: 0.2rem;
            border-bottom: 1px solid var(--border-color);
        }

        .topic-accordion-btn {
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topic-accordion-btn:hover {
            background-color: var(--accent-bg-light);
        }

        .subtopic-list {
            list-style: none;
            padding-left: 0.8rem;
            display: none;
            margin-top: 0.3rem;
        }

        .subtopic-list.open {
            display: block;
        }

        .subtopic-item {
            padding: 0.4rem 0.6rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.2rem;

        .subtopic-item:hover {
            color: var(--accent-light-blue);
            background-color: var(--bg-primary);
        }

        .subtopic-item.active {
            background-color: var(--accent-blue);
            color: #ffffff;
            font-weight: 600;
        }

        .content-area {
            padding: 2.5rem;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
        }

        .breadcrumb {
            font-size: 0.85rem;
            color: var(--accent-light-blue);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .topic-header {
            margin-bottom: 2rem;
        }

        .topic-header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .topic-lead {
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .content-section {
            margin-bottom: 2rem;
        }

        .content-section h3 {
            font-size: 1.25rem;
            color: var(--accent-light-blue);
            margin-bottom: 0.8rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border-color);
        }

        .content-section p {
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 1rem;
        }

        .terminal-card {
            background-color: var(--terminal-bg);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .terminal-header {
            background-color: var(--terminal-header);
            padding: 0.6rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .terminal-dot.red { background-color: #ef4444; }
        .terminal-dot.yellow { background-color: #f59e0b; }
        .terminal-dot.green { background-color: #10b981; }

        .terminal-title {
            color: #94a3b8;
            font-size: 0.8rem;
            font-family: monospace;
            margin-left: 0.5rem;
        }

        .terminal-body {
            padding: 1.2rem;
            overflow-x: auto;
        }

        .terminal-body code {
            font-family: 'Courier New', Courier, monospace;
            color: var(--terminal-text);
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .topic-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-color);
            padding-top: 1.5rem;
        }

        .nav-topic-buttons {
            display: flex;
            gap: 0.8rem;
        }

        @media (max-width: 992px) {
            .course-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                height: auto;
                position: relative;
                top: 0;
            }
        }

        @media (max-width: 600px) {
            .hero-title {
                font-size: 2rem;
            }

            .topic-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-topic-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

    <script>
        const courseData = [
            {
                id: "u1",
                number: "UNIDAD 1",
                title: "Escalamiento de Redes",
                description: "Diseño jerárquico de redes, expansión y selección de hardware de switches y routers.",
                topics: [
                    {
                        id: "1.1",
                        title: "1.1 Implementación de un diseño de red",
                        subtopics: [
                            {
                                id: "1.1.1",
                                title: "1.1.1 Diseño jerárquico de la red",
                                description: "El modelo de diseño jerárquico divide la red en capas independientes para facilitar su gestión y escalabilidad: Acceso, Distribución y Núcleo (Core).",
                                info: "<strong>1.1.1.1 La necesidad de escalar la red:</strong> Las redes empresariales modernas deben adaptarse al constante incremento de tráfico multimodal, como la telefonía sobre IP (VoIP), las videoconferencias de alta definición y el acceso concurrente a datos críticos alojados en la nube. Diseñar una red escalable implica prever un crecimiento seguro en la densidad de usuarios y en el ancho de banda sin obligar a la empresa a reestructurar su topología base o sufrir interrupciones prolongadas del servicio.<br><br><strong>1.1.1.2 Switches empresariales:</strong> Un diseño escalable exige abandonar los equipos domésticos y migrar hacia switches de categoría empresarial que ofrecen alta disponibilidad y robustez. Estos conmutadores permiten aplicar Calidad de Servicio (QoS) para priorizar el tráfico sensible a demoras, integrar seguridad perimetral a nivel de puerto y facilitar la administración remota avanzada.<br><br><strong>1.1.1.3 Diseño jerárquico de la red:</strong> El enfoque estructurado de Cisco divide la arquitectura general en capas independientes para simplificar el diseño, facilitar el mantenimiento y acelerar la resolución de problemas (troubleshooting).<br><br><strong>1.1.1.4 Capas del modelo jerárquico:</strong><br>- <em>Capa de Acceso:</em> Proporciona el punto de conexión directo a los dispositivos finales de los usuarios (PCs, teléfonos IP, Access Points inalámbricos). Es aquí donde se aplican las políticas iniciales como la seguridad de puerto (Port Security), la asignación de VLANs y el suministro eléctrico mediante Power over Ethernet (PoE).<br>- <em>Capa de Distribución:</em> Actúa como un agregador de los enlaces provenientes de la capa de acceso. Es el límite lógico donde ocurre el enrutamiento inter-VLAN (Capa 3), se aplican las Listas de Control de Acceso (ACLs) y se filtra o resume el tráfico.<br>- <em>Capa de Núcleo (Core):</em> Es el backbone central de alta velocidad de la red. Su único propósito es conmutar y transportar paquetes lo más rápido posible entre los distintos sitios del campus o centros de datos.<br><br><strong>1.1.1.5 Núcleo colapsado (Collapsed Core):</strong> En sedes pequeñas o medianas, las funciones de la capa de Distribución y de Núcleo se fusionan en un solo par de switches multicapa de alto rendimiento para reducir costos y complejidad de cableado.<br><br><strong>1.1.1.6 Análisis de diseño de red:</strong> Fase de evaluación continua donde los ingenieros analizan los patrones de tráfico para detectar Puntos Únicos de Falla (SPOF) e ineficiencias antes de llegar a la saturación total.",
                                code: "Switch-Acceso(config)# interface range FastEthernet 0/1 - 24\nSwitch-Acceso(config-if-range)# switchport mode access\nSwitch-Acceso(config-if-range)# switchport access vlan 10\nSwitch-Acceso(config-if-range)# spanning-tree portfast"
                            },
                            {
                                id: "1.1.2",
                                title: "1.1.2 Expansión de la red",
                                description: "Estrategias para escalar la red incluyendo redundancia, dominios de falla acotados, agregación de enlaces y protocolos de routing dinámico.",
                                info: "<strong>1.1.2.1 Diseño para escalabilidad:</strong> Requiere un direccionamiento IP jerárquico, consolidación de enlaces paralelos con EtherChannel y protocolos de enrutamiento dinámico como OSPF o EIGRP para rápida convergencia.<br><br><strong>1.1.2.2 Planificación de la redundancia:</strong> Instalación de enlaces cruzados y dispositivos duplicados para prevenir Puntos Únicos de Falla (SPOF), utilizando Spanning Tree Protocol (STP) para evitar bucles de Capa 2.<br><br><strong>1.1.2.3 Dominios de fallas:</strong> Porción de la red afectada cuando un dispositivo o enlace falla. Un diseño eficiente limita su tamaño aislando secciones mediante switches de Capa 3 o routers.<br><br><strong>1.1.2.4 Aumento del ancho de banda:</strong> Agregación de enlaces lógicos (EtherChannel) agrupando conexiones físicas para aumentar la capacidad sin reemplazar hardware.<br><br><strong>1.1.2.5 Expansión de la capa de acceso y ruteo:</strong> Soporte para densidad creciente de usuarios y puntos de acceso mediante routers modulares y direccionamiento estructurado.",
                                code: "Router(config)# router ospf 1\nRouter(config-router)# network 192.168.10.0 0.0.0.255 area 0\nRouter(config-if)# description Enlace_Hacia_Core_Secundario\nRouter(config-if)# ip address 10.0.0.1 255.255.255.252\nRouter(config-if)# no shutdown"
                            }
                        ]
                    },
                    {
                        id: "1.2",
                        title: "1.2 Selección de dispositivos",
                        subtopics: [
                            {
                                id: "1.2.1",
                                title: "1.2.1 Hardware del switch",
                                description: "Criterios para seleccionar hardware de conmutación considerando factores de forma, rendimiento, densidad de puertos y funciones adicionales.",
                                info: "<strong>1.2.1.1 Factores de forma de los switches:</strong> Conmutadores de configuración fija, modulares (chasis extensible) y apilables (Stackable) para actuar como una sola entidad lógica.<br><br><strong>1.2.1.2 Rendimiento de los switches:</strong> Determinado por el Backplane interno para soportar transmisión simultánea en todos los puertos a máxima velocidad.<br><br><strong>1.2.1.3 Densidad de puertos:</strong> Número de puertos disponibles por Unidad de Rack (RU) para maximizar espacio físico en el armario de telecomunicaciones.<br><br><strong>1.2.1.4 Tasas de reenvío (Forwarding Rates):</strong> Capacidad expresada en millones de paquetes por segundo (Mpps) procesados por hardware (ASIC).<br><br><strong>1.2.1.5 Power over Ethernet (PoE / PoE+):</strong> Transmisión de corriente eléctrica a través del cable UTP para energizar teléfonos VoIP, cámaras y APs.<br><br><strong>1.2.1.6 Conmutación multicapa:</strong> Enrutamiento IP de Capa 3 procesado a velocidad de hardware por circuitos ASIC dedicados.<br><br><strong>1.2.1.7 Búferes de paquetes:</strong> Memorias temporales para retener tramas durante momentos de congestión súbita.",
                                code: "Switch# show platform resources\nSwitch# show environment power\nSwitch# show switch stack-ports"
                            },
                            {
                                id: "1.2.2",
                                title: "1.2.2 Hardware de router",
                                description: "El hardware de router se selecciona según requisitos de red, incorporando a menudo servicios integrados (ISR).",
                                info: "<strong>1.2.2.1 Requisitos de los routers:</strong> Delimitan dominios de broadcast, interconectan VLANs y redes WAN, y aplican políticas de seguridad (Firewalls, NAT, VPNs).<br><br><strong>1.2.2.2 Arquitectura de memoria en Routers Cisco:</strong><br>- <em>RAM:</em> Aloja la tabla de enrutamiento (RIB), caché ARP y la configuración activa (`running-config`).<br>- <em>NVRAM:</em> Almacena la configuración de inicio (`startup-config`).<br>- <em>Flash:</em> Memoria permanente para la imagen del sistema operativo (Cisco IOS).<br>- <em>ROM:</em> Instrucciones de arranque (POST, Bootstrap, ROMMON).<br><br><strong>1.2.2.3 Interfaces modulares:</strong> Bahías para tarjetas expansivas HWIC/NIM (fibra, cobre, módems LTE).<br><br><strong>1.2.2.4 Routers de Servicios Integrados (ISR):</strong> Unifican ruteo, seguridad, telefonía IP y VPNs en un solo chasis.",
                                code: "Router# show version\nRouter# show file systems"
                            },
                            {
                                id: "1.2.3",
                                title: "1.2.3 Administración de dispositivos",
                                description: "Acceso seguro dentro y fuera de banda para la configuración y monitoreo de dispositivos Cisco.",
                                info: "<strong>1.2.3.1 Administración de IOS y respaldos:</strong> Almacenamiento externo de imágenes IOS y archivos de configuración en servidores TFTP/FTP para rápida recuperación ante fallas de hardware.<br><br><strong>1.2.3.2 Recuperación de contraseñas:</strong> Procedimiento físico desde ROMMON cambiando el registro de configuración a `0x2142` para omitir la carga del archivo de inicio protegido.<br><br><strong>1.2.3.3 Configuración de SSH seguro:</strong> Sustitución obligatoria de Telnet por SSHv2 cifrado definiendo un dominio IP, generando claves RSA de al menos 2048 bits y restringiendo las líneas VTY.",

                            }
                        ]
                    }

                topics: [
                    {

                                info: "<strong>2.1.1.1 Redundancia en las capas 1 y 2:</strong> Instalación de enlaces físicos paralelos para garantizar alta disponibilidad y eliminar Puntos Únicos de Falla.<br><br><strong>2.1.1.2 Problemas de redundancia (Bucles de Capa 2):</strong> Las tramas Ethernet carecen de campo TTL (Tiempo de Vida), por lo que circulan indefinidamente en enlaces redundantes sin STP.<br><br><strong>2.1.1.3 Tormentas de broadcast:</strong> Inundación masiva de tramas de difusión que consumen el 100% del ancho de banda y la CPU de los equipos hasta paralizar la red.<br><br><strong>2.1.1.4 Inestabilidad de la tabla MAC:</strong> Reescribitura caótica y continua de la tabla CAM por la llegada simultánea de tramas idénticas desde múltiples puertos.<br><br><strong>2.1.1.5 Propósito del algoritmo Spanning Tree (STA):</strong> Bloquear lógicamente los puertos redundantes para formar una topología en árbol sin bucles, activándolos automáticamente si la vía principal falla.",

                                id: "2.1.2",
                                title: "2.1.2 Funcionamiento de STP",
                                description: "El funcionamiento de STP está regido por el Algoritmo de Árbol de Expansión (STA) y el intercambio constante de mensajes BPDU.",
                                info: "<strong>2.1.2.1 Algoritmo Spanning Tree y BPDUs:</strong> Intercambio de tramas de control de Capa 2 llamadas <em>Bridge Protocol Data Units</em> (BPDUs) cada 2 segundos.<br><br><strong>2.1.2.2 Elección del Puente Raíz (Root Bridge):</strong> El switch con el menor valor de Bridge ID (BID) de la red se proclama Root Bridge.<br><br><strong>2.1.2.3 Estructura del Bridge ID (BID):</strong> Compuesto por la Prioridad (32768 por defecto) + ID del sistema extendido (VLAN) + Dirección MAC del switch.<br><br><strong>2.1.2.4 Determinación de la ruta raíz con menor costo:</strong> Evaluación del ancho de banda acumulado desde cada switch hacia el Root Bridge según los costos estándar IEEE.<br><br><strong>2.1.2.5 Roles de los puertos:</strong><br>- <em>Puerto Raíz (Root Port):</em> Puerto en switches no-root que ofrece el camino de menor costo hacia el Root Bridge.<br>- <em>Puerto Designado (Designated Port):</em> Puerto autorizado para enviar tráfico en un segmento LAN.<br>- <em>Puerto No Designado / Bloqueado:</em> Puerto redundante colocado en estado de bloqueo para prevenir bucles.<br><br><strong>2.1.2.6 Estados de los puertos en 802.1D:</strong> Bloqueo (20s) -> Escucha (15s) -> Aprendizaje (15s) -> Reenvío (Forwarding). Total: 50 segundos.",
                                code: "Switch# show spanning-tree"
                            }

                                description: "Existen múltiples versiones de protocolos de árbol de expansión, evolucionando de estándares clásicos a rápidos y basados en VLAN.",
                                info: "<strong>2.2.1.1 Variedades de STP:</strong><br>- <em>STP Clásico (802.1D):</em> Estándar original de lenta convergencia (hasta 50s).<br>- <em>PVST+ (Cisco):</em> Instancia independiente del árbol por cada VLAN existente.<br>- <em>RSTP (802.1w):</em> Reconvergencia ultra rápida mediante sincronización activa (Proposal/Agreement).<br>- <em>Rapid PVST+ (Cisco):</em> Implementa la velocidad de RSTP de forma independiente por cada VLAN.<br>- <em>MSTP (802.1s):</em> Agrupa múltiples VLANs en instancias comunes para ahorrar memoria y CPU.",

                                info: "<strong>2.2.2.1 Operación de PVST+:</strong> Permite realizar balanceo de carga en Capa 2 configurando distintos switches como Root Bridge para diferentes VLANs.<br><br><strong>2.2.2.2 Balanceo de carga:</strong> Un puerto puede estar bloqueado para la VLAN 10 pero en estado de reenvío para la VLAN 20, aprovechando todos los enlaces físicos.<br><br><strong>2.2.2.3 Desventaja:</strong> Mantiene los lentos estados de puerto de 802.1D (50 segundos de convergencia ante fallas).",

                                info: "<strong>2.2.3.1 Concepto de RSTP:</strong> Reemplaza temporizadores fijos por un mecanismo de negociación directa (Proposal/Agreement) entre switches vecinos.<br><br><strong>2.2.3.2 Estados de puerto en RSTP:</strong> Simplificados a tres: <em>Descarte (Discarding)</em>, <em>Aprendizaje (Learning)</em> y <em>Reenvío (Forwarding)</em>.<br><br><strong>2.2.3.3 Roles de puerto adicionales:</strong> Incorpora el <em>Puerto Alternativo</em> (Alternate Port), que sirve como repuesto inmediato en caliente del Puerto Raíz.<br><br><strong>2.2.3.4 Puertos de borde (Edge Ports):</strong> Interfaces conectadas a hosts finales configuradas con <code>PortFast</code> para pasar inmediatamente a reenvío.",

                                description: "Para configurar de forma segura PVST+, se debe establecer manualmente la prioridad de los puentes para forzar la elección del Root Bridge.",
                                info: "<strong>2.3.1.1 Configurar el Puente Raíz:</strong> Es obligatorio definir explícitamente el Root Bridge en el switch central para evitar que un conmutador obsoleto de acceso asuma el control del tráfico corporativo.<br><br><strong>2.3.1.2 Modificación de prioridades:</strong> La prioridad se ajusta en decrementos de 4096 (ej: 0, 4096, 8192, 24576). Se pueden utilizar las macros <code>spanning-tree vlan [X] root primary</code> (prioridad 24576) y <code>root secondary</code> (prioridad 28672).",

                                info: "<strong>2.3.2.1 Configuración de PortFast:</strong> Elimina las demoras de 30 segundos en puertos conectados a PCs o servidores, permitiendo que obtengan dirección IP por DHCP sin interrupciones.<br><br><strong>2.3.2.2 Protección con BPDU Guard:</strong> Apaga automáticamente en estado <code>err-disable</code> cualquier puerto con PortFast si detecta la llegada de una BPDU intrusa, previniendo bucles por la conexión no autorizada de switches.",

                                info: "<strong>2.3.3.1 Análisis de bucles L2:</strong> Causados frecuentemente por discrepancias de dúplex (Duplex Mismatch) o fallas de transmisión en hilos de fibra óptica (solucionado mediante el protocolo UDLD).<br><br><strong>2.3.3.2 Recuperación del estado Err-Disabled:</strong> Un puerto se desactiva al detectar violaciones de seguridad o BPDUs no autorizadas. Para restablecerlo manualmente, se deben ejecutar secuencialmente los comandos <code>shutdown</code> y <code>no shutdown</code>. Para automatizar la recuperación, se utiliza el comando global <code>errdisable recovery cause bpduguard</code> junto con <code>errdisable recovery interval [segundos]</code>.",

                                info: "<strong>2.3.4.1 Notificaciones de Cambio de Topología (TCN):</strong> En 802.1D, cada cambio de enlace hace que el Root Bridge ordene reducir el tiempo de la tabla MAC de 300s a 15s, causando purgas e inundaciones temporales.<br><br><strong>2.3.4.2 Implementación Global de PortFast:</strong> El comando <code>spanning-tree portfast default</code> aplica PortFast a todos los puertos de acceso de forma masiva para evitar la emisión de TCNs innecesarias durante el arranque de computadoras de usuarios.",

                                info: "<strong>2.4.1.1 Limitaciones del Gateway Único:</strong> Un solo router de salida representa un Punto Único de Falla (SPOF); si la interfaz o la fuente mueren, la LAN queda incomunicada.<br><br><strong>2.4.1.2 Concepto del Router Virtual (Grupo FHRP):</strong> FHRP agrupa dos o más routers físicos bajo una sola <strong>IP Virtual</strong> y <strong>MAC Virtual</strong> compartidas.<br><br><strong>2.4.1.3 Conmutación por falla transparente (Failover L3):</strong> Un router asume el rol Activo y procesa el tráfico. Si este falla, el router Standby asume automáticamente la IP y MAC Virtuales sin interrumpir las sesiones activas de los usuarios.",

                                info: "<strong>2.4.2.1 Hot Standby Router Protocol (HSRP):</strong> Protocolo propietario de Cisco que designa un router <em>Active</em> y otro <em>Standby</em>. Utiliza direcciones MAC virtuales con formato <code>0000.0c07.acXX</code>.<br><br><strong>2.4.2.2 Virtual Router Redundancy Protocol (VRRP):</strong> Estándar abierto no propietario (RFC 5798). Nombra un router <em>Master</em> y uno o más routers <em>Backup</em>.<br><br><strong>2.4.2.3 Gateway Load Balancing Protocol (GLBP):</strong> Protocolo propietario de Cisco que permite balanceo de carga activo entre routers mediante un <em>Active Virtual Gateway (AVG)</em> y múltiples <em>Active Virtual Forwarders (AVF)</em>.",

                                info: "<strong>2.4.3.1 Prioridad y Preemisión en HSRP:</strong> El router con mayor prioridad (100 por defecto) se convierte en Activo. El comando <code>standby preempt</code> obliga al router primario a retomar su rol activo tras recuperarse de una falla.<br><br><strong>2.4.3.2 Tracking de interfaces:</strong> Disminuye la prioridad de HSRP de forma automática si la interfaz WAN de salida cae, permitiendo que el Standby tome el control.<br><br><strong>2.4.3.3 Comandos de Verificación:</strong> El comando central de auditoría es <code>show standby brief</code>.",

                                info: "<strong>4.1.2.1 NICs e infraestructura PoE:</strong> Adaptadores Wi-Fi y Access Points alimentados por switches mediante PoE (802.3af/at).<br><br><strong>4.1.2.2 Routers SOHO:</strong> Equipos integrados para hogares que agrupan funciones de AP, switch, router y firewall NAT.<br><br><strong>4.1.2.3 APs Autónomos (Fat APs):</strong> Dispositivos independientes que gestionan toda la configuración de forma local.<br><br><strong>4.1.2.4 APs Ligeros (LAPs) y Controladores WLC:</strong> Arquitectura centralizada Split-MAC donde los APs son administrados dinámicamente por un controlador WLC a través de túneles CAPWAP.<br><br><strong>4.1.2.5 Antenas:</strong> Omnidireccionales (360° de cobertura) y Direccionales (Yagi/Parabólicas para enlaces punto a punto).",

                                info: "<strong>4.2.2.1 Método CSMA/CA:</strong> Las antenas no pueden detectar colisiones mientras transmiten; por ello verifican el medio y evitan colisiones de forma preventiva.<br><br><strong>4.2.2.2 Reserva RTS/CTS y NAV:</strong> El cliente envía un RTS, el AP concede el turno con un CTS y los demás hosts pausan sus transmisiones mediante un temporizador NAV.<br><br><strong>4.2.2.3 Confirmación ACK:</strong> Toda trama recibida correctamente requiere un acuse de recibo ACK obligatorio; en su ausencia, el cliente asume colisión y retransmite.<br><br><strong>4.2.2.4 Proceso de Asociación:</strong> Descubrimiento (Probes/Beacons) -> Autenticación -> Solicitud y Confirmación de Asociación al BSSID.",

        let currentSubtopicId = "1.1.1";
        let flatSubtopicsList = [];

        document.addEventListener("DOMContentLoaded", () => {
            buildFlatSubtopicsList();
            renderHomePage();
            renderSidebarTree();
            setupEventListeners();
            loadSubtopic(currentSubtopicId);
        });

        function buildFlatSubtopicsList() {
            flatSubtopicsList = [];
            courseData.forEach(unit => {
                unit.topics.forEach(topic => {
                    topic.subtopics.forEach(subtopic => {
                        flatSubtopicsList.push({
                            unitId: unit.id,
                            unitTitle: unit.title,
                            topicTitle: topic.title,
                            ...subtopic
                        });
                    });
                });
            });
        }

        function renderHomePage() {
            const unitsGrid = document.getElementById("units-grid");
            unitsGrid.innerHTML = "";

            courseData.forEach((unit) => {
                let subtopicsCount = 0;
                unit.topics.forEach(t => subtopicsCount += t.subtopics.length);

                const card = document.createElement("div");
                card.className = "unit-card";
                card.innerHTML = `
                    <div>
                        <div class="unit-card-header">
                            <div>
                                <span class="unit-tag">${unit.number}</span>
                                <h3 class="unit-card-title">${unit.title}</h3>
                            </div>
                        </div>
                        <p class="unit-card-desc">${unit.description}</p>
                    </div>
                    <div class="unit-card-footer">
                        <span class="unit-topics-count"> ${subtopicsCount} subtemas teóricos</span>
                        <button class="btn btn-outline btn-enter-unit" data-unit-id="${unit.id}">Entrar →</button>
                    </div>
                `;
                unitsGrid.appendChild(card);
            });

            document.querySelectorAll(".btn-enter-unit").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const unitId = e.target.getAttribute("data-unit-id");
                    openUnitDirectly(unitId);
                });
            });
        }

        function openUnitDirectly(unitId) {
            const unit = courseData.find(u => u.id === unitId);
            if (unit && unit.topics.length > 0 && unit.topics[0].subtopics.length > 0) {
                const firstSubtopicId = unit.topics[0].subtopics[0].id;
                showCourseView();
                loadSubtopic(firstSubtopicId);
            }
        }

        function renderSidebarTree() {
            const navTree = document.getElementById("course-tree");
            navTree.innerHTML = "";

            courseData.forEach((unit) => {
                const unitGroup = document.createElement("div");
                unitGroup.className = "unit-group";

                const unitTitle = document.createElement("div");
                unitTitle.className = "unit-group-title";
                unitTitle.innerText = `${unit.number}: ${unit.title}`;
                unitGroup.appendChild(unitTitle);

                unit.topics.forEach((topic) => {
                    const topicContainer = document.createElement("div");
                    topicContainer.className = "topic-accordion";

                    const accordionBtn = document.createElement("button");
                    accordionBtn.className = "topic-accordion-btn";
                    accordionBtn.innerHTML = `<span>${topic.title}</span> <span class="arrow">▼</span>`;

                    const subtopicList = document.createElement("ul");
                    subtopicList.className = "subtopic-list";

                    accordionBtn.addEventListener("click", () => {
                        subtopicList.classList.toggle("open");
                    });

                    topic.subtopics.forEach((sub) => {
                        const subItem = document.createElement("li");
                        subItem.className = `subtopic-item ${sub.id === currentSubtopicId ? 'active' : ''}`;
                        subItem.innerHTML = `<span>${sub.title}</span>`;
                        subItem.addEventListener("click", () => loadSubtopic(sub.id));
                        subtopicList.appendChild(subItem);
                    });

                    topicContainer.appendChild(accordionBtn);
                    topicContainer.appendChild(subtopicList);
                    unitGroup.appendChild(topicContainer);
                });

                navTree.appendChild(unitGroup);
            });
        }

        function loadSubtopic(subtopicId) {
            currentSubtopicId = subtopicId;
            const item = flatSubtopicsList.find(s => s.id === subtopicId);
            if (!item) return;

            document.getElementById("breadcrumb").innerText = `${item.unitTitle} > ${item.topicTitle}`;
            document.getElementById("topic-title").innerText = item.title;
            document.getElementById("topic-description").innerText = item.description;
            
            document.getElementById("topic-info").innerHTML = item.info;
            document.getElementById("topic-code").innerText = item.code;

            renderSidebarTree();
            autoExpandActiveSubtopic();
        }

        function autoExpandActiveSubtopic() {
            const activeItem = document.querySelector(".subtopic-item.active");
            if (activeItem) {
                const parentList = activeItem.closest(".subtopic-list");
                if (parentList) parentList.classList.add("open");
            }
        }

        function showHomeView() {
            document.getElementById("home-view").className = "view-active";
            document.getElementById("course-view").className = "view-hidden";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showCourseView() {
            document.getElementById("home-view").className = "view-hidden";
            document.getElementById("course-view").className = "view-active";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function navigateTopic(direction) {
            const currentIndex = flatSubtopicsList.findIndex(s => s.id === currentSubtopicId);
            if (currentIndex === -1) return;

            let targetIndex = currentIndex + direction;
            if (targetIndex >= 0 && targetIndex < flatSubtopicsList.length) {
                loadSubtopic(flatSubtopicsList[targetIndex].id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function setupEventListeners() {
            document.getElementById("btn-back-home").addEventListener("click", showHomeView);
            document.getElementById("btn-view-units").addEventListener("click", () => {
                document.getElementById("unidades-section").scrollIntoView({ behavior: 'smooth' });
            });
            document.getElementById("btn-prev-topic").addEventListener("click", () => navigateTopic(-1));
            document.getElementById("btn-next-topic").addEventListener("click", () => navigateTopic(1));
        }
    </script>
</body>
</html>
